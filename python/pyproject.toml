[project]
name = "apiverve-wordladdergenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Word Ladder Generator creates puzzles where players transform one word into another by changing one letter at a time, with each step forming a valid word."
keywords = ["word ladder", "word chain", "doublets", "word puzzle", "vocabulary game"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/wordladder?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/wordladder?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/wordladder-api"
Twitter = "https://twitter.com/apivervehq"
